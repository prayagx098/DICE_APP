<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ludo Dice - Premium 3D Roller</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="./favicon.png" type="image/x-icon">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <!-- Full-screen interactive swipe & tap viewport -->
    <div class="viewport" id="swipe-zone">
        <div class="dice-shake-wrapper" id="dice-wrapper">
            <div class="diceContainer">
                <div class="dice" id="dice">
                    <!-- Pips will be dynamically generated by JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Audio Fallback -->
    <audio id="dice-sound" src="./dice.mp3" preload="auto"></audio>

    <!-- JS -->
    <script src="script.js?v=3"></script>
</body>
</html>
