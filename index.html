<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#05060a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Ludo Dice - Premium 3D Roller</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="./favicon.png" type="image/x-icon">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
    <!-- Full-screen interactive swipe & tap viewport -->
    <div class="viewport" id="swipe-zone">
        <div class="stage">
            <div class="dice-shadow" id="dice-shadow"></div>
            <div class="dice-wrapper" id="dice-wrapper">
                <div class="diceContainer">
                    <div class="dice" id="dice">
                        <!-- Pips will be dynamically generated by JS -->
                    </div>
                </div>
            </div>
        </div>
        <div class="hint" id="hint">Swipe or tap to roll</div>
    </div>

    <!-- Audio Fallback -->
    <audio id="dice-sound" src="./dice.mp3" preload="auto"></audio>

    <!-- JS -->
    <script src="script.js?v=4"></script>
</body>
</html>
